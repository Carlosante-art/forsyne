<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F1210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Forsyne — Trender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#0F1210; --ink2:#131714;
  --fg:#F2F0EA; --fg2:#CCC9BF; --fg3:#8A8E89; --fg4:#4a4e49;
  --accent:#8FAE8A; --warn:#C4875A; --danger:#A85C5C; --trust:#5B7FA6;
  --border:rgba(242,240,234,0.06);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',system-ui,sans-serif;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html, body {
  background: linear-gradient(to bottom, var(--ink) 0%, var(--ink2) 100%);
  color: var(--fg); font-family: var(--sans); font-weight: 300; line-height: 1.7;
  min-height: 100vh; min-height: 100dvh;
  -webkit-font-smoothing: antialiased; -webkit-overflow-scrolling: touch; overflow-x: hidden;
}
.frame { max-width: 430px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
@media (min-width: 500px) {
  body { background: #050605; padding: 2rem 0; }
  .frame { background: linear-gradient(to bottom, var(--ink) 0%, var(--ink2) 100%); border-radius: 36px; overflow: hidden; box-shadow: 0 0 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05); margin-top: 1rem; padding-bottom: 1rem; }
}

nav {
  height: 56px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.5rem; border-bottom: 1px solid var(--border);
  background: rgba(15,18,16,0.85); backdrop-filter: blur(32px);
  position: sticky; top: 0; z-index: 100;
}
.logo { font-family: var(--serif); font-size: 1.05rem; letter-spacing: 0.18em; }
.nav-title { font-family: var(--serif); font-size: 0.95rem; color: var(--fg2); font-style: italic; }
.nav-icons { display: flex; gap: 0.9rem; align-items: center; }
.nav-icon { font-size: 1.05rem; color: var(--fg3); cursor: pointer; text-decoration: none; }
.nav-icon:hover { color: var(--fg2); }

.period {
  display: flex; gap: 0.4rem;
  padding: 1rem 1.5rem 0.85rem;
  background: rgba(15,18,16,0.7); backdrop-filter: blur(20px);
  position: sticky; top: 56px; z-index: 50;
  border-bottom: 1px solid var(--border);
}
.period-btn {
  background: transparent; border: 1px solid var(--border); color: var(--fg3);
  font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase;
  padding: 0.45rem 1rem; cursor: pointer; transition: all 0.2s ease;
}
.period-btn.active { background: var(--accent); color: var(--ink); border-color: var(--accent); }

.cards { display: flex; flex-direction: column; }
.card {
  padding: 1.4rem 1.5rem 1.6rem;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.18s ease;
  opacity: 0; transform: translateY(8px);
  animation: cardIn 0.5s ease forwards;
}
.card:hover { background: rgba(242,240,234,0.015); }
.card:nth-child(1) { animation-delay: 0.1s; }
.card:nth-child(2) { animation-delay: 0.18s; }
.card:nth-child(3) { animation-delay: 0.26s; }
.card:nth-child(4) { animation-delay: 0.34s; }
.card:nth-child(5) { animation-delay: 0.42s; }
.card:nth-child(6) { animation-delay: 0.5s; }
@keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.55rem; }
.card-label { font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg3); }
.card-delta { font-size: 0.85rem; display: flex; align-items: center; gap: 0.3rem; }
.delta-up { color: var(--accent); }
.delta-down { color: var(--warn); }
.delta-strain { color: var(--danger); }
.delta-stable { color: var(--fg3); }

.card-value { display: flex; align-items: baseline; gap: 0.55rem; margin-bottom: 0.85rem; }
.value-primary { font-size: 1.6rem; font-weight: 300; color: var(--fg); }
.value-context { font-size: 0.85rem; color: var(--fg2); font-weight: 300; }
.value-context::before { content: '·'; color: var(--fg4); margin-right: 0.55rem; }
.empty-card { font-size: 0.85rem; color: var(--fg3); font-style: italic; padding: 0.5rem 0; }

.chart { width: 100%; height: 56px; display: block; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 56px; }
.bar { flex: 1; opacity: 0.85; min-height: 2px; }
.bar.low { background: var(--accent); }
.bar.over { background: var(--warn); }
.bar.way-over { background: var(--danger); }

.bottom-nav {
  margin-top: auto;
  display: grid; grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--border);
  background: rgba(15,18,16,0.85); backdrop-filter: blur(20px);
  position: sticky; bottom: 0;
}
.bn-item {
  display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
  padding: 0.85rem 0;
  font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--fg3); text-decoration: none; cursor: pointer;
  transition: color 0.2s ease;
  padding-bottom: calc(0.85rem + env(safe-area-inset-bottom, 0px));
}
.bn-item.active { color: var(--fg); }
.bn-item:hover { color: var(--fg2); }
.bn-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: 0; }
.bn-item.active .bn-dot { opacity: 1; }

.loading { padding: 4rem 2rem; text-align: center; }
.loading-dots { display: inline-flex; gap: 6px; }
.loading-dots span { width: 6px; height: 6px; background: var(--fg3); border-radius: 50%; animation: dotPulse 1.4s ease-in-out infinite; }
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
.loading-text { font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg3); margin-top: 1rem; }
@keyframes dotPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
</style>
</head>
<body>

<div class="frame">

  <nav>
    <div class="logo">forsyne</div>
    <div class="nav-title">Trender</div>
    <div class="nav-icons">
      <a href="profile.html" class="nav-icon" title="Profil">◈</a>
      <a href="../wearables.html" class="nav-icon" title="Inställningar">⚙</a>
    </div>
  </nav>

  <div class="period">
    <button class="period-btn active" data-period="14">14d</button>
    <button class="period-btn" data-period="90">90d</button>
    <button class="period-btn" data-period="365">1år</button>
  </div>

  <div class="loading" id="loading">
    <div class="loading-dots"><span></span><span></span><span></span></div>
    <div class="loading-text">Räknar trender</div>
  </div>

  <div class="cards" id="cards" style="display:none;"></div>

  <div class="bottom-nav">
    <a class="bn-item" href="today.html"><div class="bn-dot"></div><span>Idag</span></a>
    <a class="bn-item active" href="trends.html"><div class="bn-dot"></div><span>Trender</span></a>
    <a class="bn-item" href="checkin.html"><div class="bn-dot"></div><span>Check-in</span></a>
    <a class="bn-item" href="chat.html"><div class="bn-dot"></div><span>Samtal</span></a>
  </div>

</div>

<script>
function token(){ return localStorage.getItem('prv_token') || ''; }
function authHeaders(){ const t = token(); return t ? { 'Authorization': 'Bearer ' + t } : {}; }

if (!token()) window.location.href = '/login.html?from=' + encodeURIComponent(location.pathname);

let currentPeriod = 14;
let allData = null;

async function fetchJSON(url) {
  const r = await fetch(url, { headers: authHeaders() });
  if (r.status === 401) { localStorage.removeItem('prv_token'); window.location.href = '/login.html'; throw new Error('unauthenticated'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function avg(arr) { if (!arr.length) return null; return arr.reduce((s,x) => s+x, 0) / arr.length; }
function fmtDelta(curr, baseline) {
  if (curr == null || baseline == null) return '—';
  const d = curr - baseline;
  const sign = d > 0 ? '+' : '';
  return sign + Math.round(d * 10) / 10;
}

function sparklinePath(values, w, h) {
  if (!values || values.length < 2) return null;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const xs = values.map((_, i) => (i / (values.length - 1)) * w);
  const ys = values.map(v => h - ((v - min) / range) * (h - 6) - 3);
  return { path: xs.map((x, i) => `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' '), lastX: xs[xs.length-1], lastY: ys[ys.length-1] };
}

function buildCard({ label, delta, deltaClass, primary, context, chartHTML }) {
  return `
    <div class="card">
      <div class="card-head">
        <div class="card-label">${label}</div>
        <div class="card-delta ${deltaClass || ''}">${delta || ''}</div>
      </div>
      ${primary ? `
        <div class="card-value">
          <div class="value-primary">${primary}</div>
          ${context ? `<div class="value-context">${context}</div>` : ''}
        </div>
      ` : ''}
      ${chartHTML || ''}
    </div>
  `;
}

function renderCards() {
  const cardsEl = document.getElementById('cards');
  const period = currentPeriod;
  const checkins = (allData.checkins || []).slice(0, period);
  const garmin = allData.integrations?.find(i => i.provider === 'garmin')?.data || {};

  const cards = [];

  // 1. Composite trend (use psi from daily_data if available, else energy as proxy)
  const dailyData = allData.dailyData || [];
  const compositeVals = dailyData.slice(0, period).map(d => d.psi).filter(v => v != null);
  if (compositeVals.length >= 2) {
    const today = compositeVals[0];
    const baseline = avg(compositeVals);
    const sp = sparklinePath(compositeVals.slice().reverse(), 280, 56);
    const chart = sp ? `<svg class="chart" viewBox="0 0 280 56" preserveAspectRatio="none">
      <path d="${sp.path}" fill="none" stroke="#8FAE8A" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="${sp.lastX}" cy="${sp.lastY}" r="3.5" fill="#8FAE8A"/>
    </svg>` : '';
    cards.push(buildCard({
      label: 'Composite',
      delta: fmtDelta(today, baseline) + ' vs snitt',
      deltaClass: today >= baseline ? 'delta-up' : 'delta-down',
      primary: Math.round(today),
      context: Math.round(baseline) + ' snitt ' + period + 'd',
      chartHTML: chart,
    }));
  } else {
    cards.push(buildCard({
      label: 'Composite',
      delta: '',
      primary: null,
      chartHTML: '<div class="empty-card">Bygger composite-trend. Loggar du dagligen så fyller den i.</div>',
    }));
  }

  // 2. HRV Balance
  const hrvData = (garmin.hrv || []).slice(0, period);
  if (hrvData.length >= 2) {
    const recent = hrvData.slice(0, 7).map(d => d.avg_hrv);
    const baseline = avg(hrvData.map(d => d.avg_hrv));
    const recentAvg = avg(recent);
    const pctChange = ((recentAvg - baseline) / baseline) * 100;
    const sp = sparklinePath(hrvData.map(d => d.avg_hrv).reverse(), 280, 56);
    const isUp = pctChange > 2;
    const isDown = pctChange < -2;
    cards.push(buildCard({
      label: 'HRV Balance',
      delta: (isUp ? 'Stigande ↗' : isDown ? 'Sjunkande ↘' : 'Stabil →'),
      deltaClass: isUp ? 'delta-up' : isDown ? 'delta-down' : 'delta-stable',
      primary: (pctChange > 0 ? '+' : '') + pctChange.toFixed(1) + '%',
      context: 'vs ' + period + 'd-baseline',
      chartHTML: `<svg class="chart" viewBox="0 0 280 56" preserveAspectRatio="none">
        <path d="${sp.path}" fill="none" stroke="${isDown ? '#C4875A' : '#8FAE8A'}" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="${sp.lastX}" cy="${sp.lastY}" r="3.5" fill="${isDown ? '#C4875A' : '#8FAE8A'}"/>
      </svg>`,
    }));
  } else {
    cards.push(buildCard({
      label: 'HRV Balance',
      delta: '',
      primary: null,
      chartHTML: '<div class="empty-card">Behöver ≥ 7 dagars HRV-data. Importera Garmin eller logga manuellt.</div>',
    }));
  }

  // 3. Sleep regularity (from sleep hours variance — proxy until bedtime data)
  const sleepData = checkins.filter(c => c.sleep != null).map(c => c.sleep);
  if (sleepData.length >= 7) {
    const meanSleep = avg(sleepData);
    const variance = sleepData.reduce((s, v) => s + Math.pow(v - meanSleep, 2), 0) / sleepData.length;
    const stdDev = Math.sqrt(variance);
    const driftMin = Math.round(stdDev * 60);
    const target = 30;
    const isOver = driftMin > target;
    const bars = sleepData.slice().reverse().map(v => {
      const dev = Math.abs(v - meanSleep);
      const minutes = Math.round(dev * 60);
      const cls = minutes > 60 ? 'way-over' : minutes > 30 ? 'over' : 'low';
      const h = Math.min(100, (minutes / 90) * 100);
      return `<div class="bar ${cls}" style="height:${h}%"></div>`;
    }).join('');
    cards.push(buildCard({
      label: 'Sömn-regularitet',
      delta: isOver ? 'Driftande +' + (driftMin - target) + 'm' : 'Stabil',
      deltaClass: isOver ? 'delta-down' : 'delta-up',
      primary: '±' + driftMin + ' min',
      context: 'target ±' + target,
      chartHTML: '<div class="bars">' + bars + '</div>',
    }));
  } else {
    cards.push(buildCard({
      label: 'Sömn-regularitet',
      delta: '',
      primary: null,
      chartHTML: '<div class="empty-card">Behöver ≥ 7 sömnloggningar. Logga sömntimmar dagligen.</div>',
    }));
  }

  // 4. Vilopuls
  const rhrData = (garmin.resting_hr || []).slice(0, period);
  if (rhrData.length >= 2) {
    const today = rhrData[0].bpm;
    const baseline = avg(rhrData.map(d => d.bpm));
    const sp = sparklinePath(rhrData.map(d => d.bpm).reverse(), 280, 56);
    const isUp = today > baseline + 1;
    cards.push(buildCard({
      label: 'Vilopuls',
      delta: fmtDelta(today, baseline) + ' bpm vs ' + period + 'd',
      deltaClass: isUp ? 'delta-down' : 'delta-up',
      primary: today,
      context: Math.round(baseline) + ' baseline',
      chartHTML: `<svg class="chart" viewBox="0 0 280 56" preserveAspectRatio="none">
        <path d="${sp.path}" fill="none" stroke="${isUp ? '#C4875A' : '#8FAE8A'}" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="${sp.lastX}" cy="${sp.lastY}" r="3.5" fill="${isUp ? '#C4875A' : '#8FAE8A'}"/>
      </svg>`,
    }));
  } else {
    cards.push(buildCard({
      label: 'Vilopuls',
      delta: '',
      primary: null,
      chartHTML: '<div class="empty-card">Behöver ≥ 2 vilopuls-loggningar. Skriv in från klockan dagligen.</div>',
    }));
  }

  // 5. Träningsbelastning (ACWR)
  const acts = (garmin.activities || []).filter(a => a.duration_min != null);
  if (acts.length >= 14) {
    const now = Date.now();
    const dayMs = 24*60*60*1000;
    const last7 = acts.filter(a => (now - new Date(a.date).getTime()) <= 7 * dayMs);
    const last28 = acts.filter(a => (now - new Date(a.date).getTime()) <= 28 * dayMs);
    const sum7 = last7.reduce((s,a) => s + a.duration_min, 0);
    const sum28 = last28.reduce((s,a) => s + a.duration_min, 0);
    const avg7 = sum7 / 7;
    const avg28 = sum28 / 28;
    const acwr = avg28 > 0 ? avg7 / avg28 : 0;
    let zone = 'stabil', zoneClass = 'delta-stable';
    if (acwr > 1.5) { zone = 'risk', zoneClass = 'delta-strain'; }
    else if (acwr > 1.0) { zone = 'påbyggande', zoneClass = 'delta-up'; }
    else if (acwr < 0.8) { zone = 'återhämtar', zoneClass = 'delta-down'; }
    cards.push(buildCard({
      label: 'Träningsbelastning',
      delta: zone,
      deltaClass: zoneClass,
      primary: acwr.toFixed(2),
      context: 'ACWR (1.0 = stabil)',
      chartHTML: `<div style="font-size:0.75rem;color:var(--fg3);margin-top:0.4rem;">7d: ${Math.round(avg7)} min/dag · 28d: ${Math.round(avg28)} min/dag</div>`,
    }));
  } else {
    cards.push(buildCard({
      label: 'Träningsbelastning',
      delta: '',
      primary: null,
      chartHTML: '<div class="empty-card">Behöver ≥ 14 dagars träningsdata. Importera .fit-filer från Garmin.</div>',
    }));
  }

  // 6. Subjektiv (energy + mood average)
  const subjData = checkins.filter(c => c.energy != null);
  if (subjData.length >= 3) {
    const recent = subjData.slice(0, 7);
    const e = avg(recent.map(c => c.energy)) / 2; // 2-10 → 1-5
    const sp = sparklinePath(subjData.slice(0, period).map(c => c.energy).reverse(), 280, 56);
    cards.push(buildCard({
      label: 'Subjektiv energi',
      delta: e >= 4 ? 'Hög ↗' : e >= 2.5 ? 'Stabil →' : 'Låg ↘',
      deltaClass: e >= 4 ? 'delta-up' : e >= 2.5 ? 'delta-stable' : 'delta-down',
      primary: e.toFixed(1) + '/5',
      context: 'snitt 7d',
      chartHTML: `<svg class="chart" viewBox="0 0 280 56" preserveAspectRatio="none">
        <path d="${sp.path}" fill="none" stroke="#8FAE8A" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="${sp.lastX}" cy="${sp.lastY}" r="3.5" fill="#8FAE8A"/>
      </svg>`,
    }));
  } else {
    cards.push(buildCard({
      label: 'Subjektiv energi',
      delta: '',
      primary: null,
      chartHTML: '<div class="empty-card">Behöver ≥ 3 check-ins. Logga energi dagligen.</div>',
    }));
  }

  cardsEl.innerHTML = cards.join('');
}

async function init() {
  try {
    const [checkins, integrations] = await Promise.all([
      fetchJSON('/api/checkins').catch(() => []),
      fetchJSON('/api/integrations').catch(() => []),
    ]);
    let dailyData = [];
    try {
      const d = await fetchJSON('/api/daily-data');
      if (Array.isArray(d)) dailyData = d;
    } catch (e) {}
    allData = { checkins, integrations, dailyData };
    document.getElementById('loading').style.display = 'none';
    document.getElementById('cards').style.display = 'flex';
    renderCards();
  } catch (e) {
    console.error(e);
    document.getElementById('loading').innerHTML = '<div class="loading-text" style="color:var(--danger)">Kunde inte ladda. ' + e.message + '</div>';
  }
}

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = parseInt(btn.dataset.period);
    if (allData) renderCards();
  });
});

init();
</script>

</body>
</html>
