<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F1210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Forsyne — Insikter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#0F1210; --ink2:#131714;
  --fg:#F2F0EA; --fg2:#CCC9BF; --fg3:#8A8E89; --fg4:#4a4e49;
  --accent:#8FAE8A; --warn:#C4875A; --danger:#A85C5C; --trust:#5B7FA6;
  --border:rgba(242,240,234,0.06);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',system-ui,sans-serif;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html, body { background: linear-gradient(to bottom, var(--ink) 0%, var(--ink2) 100%); color: var(--fg); font-family: var(--sans); font-weight: 300; line-height: 1.7; min-height: 100vh; min-height: 100dvh; -webkit-font-smoothing: antialiased; -webkit-overflow-scrolling: touch; overflow-x: hidden; }
.frame { max-width: 430px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
@media (min-width: 500px) { body { background: #050605; padding: 2rem 0; } .frame { background: linear-gradient(to bottom, var(--ink) 0%, var(--ink2) 100%); border-radius: 36px; overflow: hidden; box-shadow: 0 0 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05); margin-top: 1rem; padding-bottom: 1rem; } }

nav { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; border-bottom: 1px solid var(--border); background: rgba(15,18,16,0.85); backdrop-filter: blur(32px); position: sticky; top: 0; z-index: 100; }
.logo { font-family: var(--serif); font-size: 1.05rem; letter-spacing: 0.18em; }
.nav-title { font-family: var(--serif); font-size: 0.95rem; color: var(--fg2); font-style: italic; }
.nav-icons { display: flex; gap: 0.9rem; align-items: center; }
.nav-icon { font-size: 1.05rem; color: var(--fg3); cursor: pointer; text-decoration: none; }
.nav-icon:hover { color: var(--fg2); }

.digest { margin: 1.4rem 1.25rem 0; padding: 1.2rem 1.25rem; border: 1px solid rgba(91, 127, 166, 0.22); background: rgba(91, 127, 166, 0.05); border-left: 2px solid var(--trust); cursor: pointer; transition: background 0.2s ease; }
.digest:hover { background: rgba(91, 127, 166, 0.08); }
.digest-label { font-size: 0.6rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--trust); margin-bottom: 0.7rem; }
.digest-stats { display: flex; flex-direction: column; gap: 0.3rem; }
.digest-stat { font-family: var(--serif); font-size: 1.0rem; color: var(--fg); line-height: 1.5; }

.cards { display: flex; flex-direction: column; padding-top: 0.6rem; }
.card { padding: 1.4rem 1.5rem 1.5rem; border-bottom: 1px solid var(--border); border-left: 2px solid transparent; cursor: pointer; opacity: 0; transform: translateY(8px); animation: cardIn 0.5s ease forwards; transition: background 0.2s ease; }
.card:hover { background: rgba(242,240,234,0.015); }
.card:nth-child(1) { animation-delay: 0.15s; }
.card:nth-child(2) { animation-delay: 0.23s; }
.card:nth-child(3) { animation-delay: 0.31s; }
.card:nth-child(4) { animation-delay: 0.39s; }
@keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

.card.korrelation { border-left-color: transparent; }
.card.prediktion-verified { border-left-color: var(--accent); background: rgba(143,174,138,0.025); }
.card.prediktion-active { border-left-color: var(--warn); background: rgba(196,135,90,0.025); }
.card.anomali { border-left: 3px solid var(--danger); background: rgba(168,92,92,0.04); }
.card.rekommendation { border-left-color: transparent; }

.card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.85rem; gap: 0.5rem; }
.card-type { font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg2); font-weight: 400; }
.korrelation .card-type { color: var(--fg2); }
.prediktion-verified .card-type { color: var(--accent); }
.prediktion-active .card-type { color: var(--warn); }
.anomali .card-type { color: var(--danger); font-weight: 500; }
.card-meta { font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg3); }

.card-statement { font-family: var(--serif); font-size: 1.18rem; font-weight: 400; line-height: 1.45; color: var(--fg); margin-bottom: 0.85rem; }
.bio-context { font-size: 0.78rem; color: var(--fg3); font-style: italic; margin-bottom: 0.95rem; padding-left: 0.7rem; border-left: 1px solid var(--border); }

.empty-state { padding: 4rem 2rem; text-align: center; color: var(--fg2); font-family: var(--serif); font-style: italic; font-size: 1.05rem; line-height: 1.7; }
.empty-state .empty-meta { font-family: var(--sans); font-style: normal; font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg3); margin-bottom: 1rem; }

.bottom-nav { margin-top: auto; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--border); background: rgba(15,18,16,0.85); backdrop-filter: blur(20px); position: sticky; bottom: 0; }
.bn-item { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; padding: 0.85rem 0; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg3); text-decoration: none; padding-bottom: calc(0.85rem + env(safe-area-inset-bottom, 0px)); }
.bn-item.active { color: var(--fg); }
.bn-item:hover { color: var(--fg2); }
.bn-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: 0; }
.bn-item.active .bn-dot { opacity: 1; }

.loading { padding: 4rem 2rem; text-align: center; }
.loading-dots { display: inline-flex; gap: 6px; }
.loading-dots span { width: 6px; height: 6px; background: var(--fg3); border-radius: 50%; animation: dotPulse 1.4s ease-in-out infinite; }
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
.loading-text { font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg3); margin-top: 1rem; }
@keyframes dotPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
</style>
</head>
<body>

<div class="frame">

  <nav>
    <div class="logo">forsyne</div>
    <div class="nav-title">Insikter</div>
    <div class="nav-icons">
      <a href="profile.html" class="nav-icon" title="Profil">◈</a>
      <a href="../wearables.html" class="nav-icon" title="Inställningar">⚙</a>
    </div>
  </nav>

  <div class="loading" id="loading">
    <div class="loading-dots"><span></span><span></span><span></span></div>
    <div class="loading-text">Hämtar insikter</div>
  </div>

  <div id="main" style="display:none;"></div>

  <div class="bottom-nav">
    <a class="bn-item" href="today.html"><div class="bn-dot"></div><span>Idag</span></a>
    <a class="bn-item" href="trends.html"><div class="bn-dot"></div><span>Trender</span></a>
    <a class="bn-item" href="checkin.html"><div class="bn-dot"></div><span>Check-in</span></a>
    <a class="bn-item" href="chat.html"><div class="bn-dot"></div><span>Samtal</span></a>
  </div>

</div>

<script>
function token(){ return localStorage.getItem('prv_token') || ''; }
function authHeaders(){ const t = token(); return t ? { 'Authorization': 'Bearer ' + t } : {}; }
if (!token()) window.location.href = '/login.html?from=' + encodeURIComponent(location.pathname);

async function fetchJSON(url) {
  const r = await fetch(url, { headers: authHeaders() });
  if (r.status === 401) { localStorage.removeItem('prv_token'); window.location.href = '/login.html'; throw new Error('unauthenticated'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const months = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  return d.getDate() + ' ' + months[d.getMonth()];
}

function buildCard(insight) {
  const cls = insight.type || 'korrelation';
  const typeLabel = {
    'anomali': 'Anomali',
    'prediktion-verified': 'Prediktion verifierad',
    'prediktion-active': 'Prediktion · aktiv',
    'korrelation': 'Korrelation',
    'rekommendation': 'Rekommendation',
  }[cls] || 'Insikt';

  return `
    <div class="card ${cls}">
      <div class="card-head">
        <div class="card-type">${typeLabel}${insight.confidence ? ' · ' + insight.confidence : ''}</div>
        <div class="card-meta">${insight.timing || ''}</div>
      </div>
      <div class="card-statement">${insight.statement}</div>
      ${insight.context ? `<div class="bio-context">${insight.context}</div>` : ''}
    </div>
  `;
}

async function loadAll() {
  const [checkins, integrations] = await Promise.all([
    fetchJSON('/api/checkins').catch(() => []),
    fetchJSON('/api/integrations').catch(() => []),
  ]);
  let dailyData = [];
  try {
    const d = await fetchJSON('/api/daily-data');
    if (Array.isArray(d)) dailyData = d;
  } catch (e) {}
  return { checkins, integrations, dailyData };
}

function generateInsightsFromData(data) {
  const insights = [];
  const checkins = data.checkins || [];
  const garmin = data.integrations?.find(i => i.provider === 'garmin')?.data || {};
  const dailyData = data.dailyData || [];

  // Latest daily_data with actual agent output
  if (dailyData.length > 0) {
    const today = dailyData[0];
    if (today.insight?.insikt || today.insight?.text) {
      insights.push({
        type: 'korrelation',
        confidence: 'från agenten',
        timing: 'idag',
        statement: today.insight.insikt || today.insight.text,
      });
    }
    if (today.prediction?.varsel_status && today.prediction.varsel_status !== 'ingen') {
      insights.push({
        type: today.prediction.varsel_status === 'krasch' ? 'anomali' : 'prediktion-active',
        timing: today.prediction.varsel_status,
        statement: today.prediction.kritisk_atgard || `Varsel-status: ${today.prediction.varsel_status}. Dag ${today.prediction.varsel_dag} i sekvensen.`,
      });
    }
    if (today.balance?.styrkeinsikt) {
      insights.push({
        type: 'rekommendation',
        timing: 'denna vecka',
        statement: today.balance.styrkeinsikt,
      });
    }
  }

  // RHR anomaly check (manual rule)
  const rhrData = garmin.resting_hr || [];
  if (rhrData.length >= 7) {
    const recent3 = rhrData.slice(0, 3);
    const baseline = rhrData.slice(3).reduce((s, r) => s + r.bpm, 0) / (rhrData.length - 3);
    const allAbove = recent3.every(r => r.bpm > baseline + 6);
    if (allAbove) {
      insights.push({
        type: 'anomali',
        timing: 'nu',
        statement: `Vilopuls +${Math.round(recent3[0].bpm - baseline)} bpm i 3 dagar — kan vara ingående infektion eller värmebelastning.`,
        context: 'Per Stanford-studie 2020: RHR-anomalier förutser sjukdom i 4-9 dagar i förväg.',
      });
    }
  }

  return insights;
}

async function init() {
  try {
    const data = await loadAll();
    document.getElementById('loading').style.display = 'none';

    const insights = generateInsightsFromData(data);
    const checkinCount = data.checkins.length;
    const dailyCount = data.dailyData.length;
    const garmin = data.integrations?.find(i => i.provider === 'garmin')?.data || {};
    const sleepCount = (garmin.sleep || []).length;

    let html = '';

    // Weekly digest
    if (insights.length > 0 || checkinCount >= 3) {
      html += `
        <div class="digest">
          <div class="digest-label">Denna vecka</div>
          <div class="digest-stats">
            <div class="digest-stat"><strong>${insights.length} insikter</strong> aktiva</div>
            <div class="digest-stat">${checkinCount} check-ins totalt</div>
            <div class="digest-stat">${(garmin.activities || []).length} träningssessioner</div>
          </div>
        </div>
      `;
    }

    // Cards
    if (insights.length > 0) {
      html += '<div class="cards">';
      html += insights.map(buildCard).join('');
      html += '</div>';
    } else {
      const dataDays = Math.min(checkinCount + sleepCount, 14);
      html += `
        <div class="empty-state">
          <div class="empty-meta">Bygger insikter</div>
          ${dataDays < 14 ? `Jag behöver ungefär 14 dagar data innan starka mönster framträder. Du är dag ${dataDays} av 14.` : 'Jag tittar — inga starka mönster ännu. Fortsätt logga.'}
        </div>
      `;
    }

    document.getElementById('main').innerHTML = html;
    document.getElementById('main').style.display = 'block';

  } catch (e) {
    console.error(e);
    document.getElementById('loading').innerHTML = '<div class="loading-text" style="color:var(--danger)">Kunde inte ladda. ' + e.message + '</div>';
  }
}

init();
</script>

</body>
</html>
